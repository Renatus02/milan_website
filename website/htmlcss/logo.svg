<!-- ProntoRiparo 24h Logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Logo ProntoRiparo 24h">
  <defs>
    <linearGradient id="shieldGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#b91c1c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Shield base -->
  <path d="M128 20l86 32v64c0 60-45 100-86 120-41-20-86-60-86-120V52l86-32z" fill="url(#shieldGradient)" filter="url(#shadow)"/>
  <!-- Wrench silhouette -->
  <path d="M152 80c-8 0-15 4-19 10l-43 54c-5 6-4 15 2 20 6 5 15 4 20-2l28-35 10 8c2 2 5 2 7 0l6-6c2-2 2-5 0-7l-10-8 9-11c6-7 5-18-2-24-4-3-8-5-13-5zm-54 84c-2 2-5 2-7 0-2-2-2-5 0-7l5-6 7 5-5 6z" fill="#fff"/>
  <!-- 24h lightning bolt accent -->
  <path d="M178 104l-34 14 14-30-34 14 20-40" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0"/>
  <!-- Circular outline -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>
</svg>